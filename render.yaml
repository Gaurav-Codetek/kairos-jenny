# Kairos + Jenny on Render (Blueprint): the database, the API and the app.
#   Render dashboard → New → Blueprint → this repo. It asks for the secrets marked `sync: false`.
# Step by step, including loading the data: deploy/RENDER.md
#
# The URLs below assume Render gives the services their names as subdomains (kairos-jenny-api.onrender.com,
# kairos-jenny-web.onrender.com). If it adds a suffix because a name is taken, correct the four URL values and
# redeploy both services.

databases:
  - name: kairos-jenny-db
    databaseName: kairos
    user: kairos
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # The API: FastAPI, Jenny's brain and the Kairos context layer. Exactly one instance, always on: her pulse, enrichment
  # runs and calls live in this process.
  - type: web
    name: kairos-jenny-api
    runtime: docker
    region: frankfurt
    plan: standard
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT # the port the image listens on
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: kairos-jenny-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # NVIDIA Nemotron on Nebius Token Factory: Kairos's reasoning and Jenny
      - key: LLM_PROVIDER
        value: nebius
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_MODEL
        value: nvidia/Nemotron-3.5-Super-VL
      - key: NEBIUS_FAST_MODEL
        value: nvidia/Nemotron-3_5-Lightning
      - key: COMPANION_LLM
        value: nebius:nvidia/Nemotron-3.5-Super-VL
      # Embeddings for meaning-based search (the stored vectors were made with text-embedding-3-large)
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      # Jenny's voice, and her fast read of each turn
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      # The warehouse she watches: use a read-only role
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_TOKEN
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_ROLE
        sync: false
      # Weather news for a city (Tavily), only when she's asked about the weather
      - key: JENNY_WEB_SEARCH
        value: "1"
      - key: TAVILY_API_KEY
        sync: false
      # Where it's reached
      - key: FRONTEND_ORIGINS
        value: '["https://kairos-jenny-web.onrender.com"]'
      - key: PUBLIC_API_URL
        value: https://kairos-jenny-api.onrender.com
      - key: MCP_ALLOWED_HOSTS
        value: kairos-jenny-api.onrender.com
      - key: LANGCHAIN_TRACING_V2
        value: "false"

  # The app (Next.js). NEXT_PUBLIC_* values are read when it's built: change one, then redeploy.
  - type: web
    name: kairos-jenny-web
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://kairos-jenny-api.onrender.com/api/v1
      - key: API_ORIGIN
        value: https://kairos-jenny-api.onrender.com
      - key: NEXT_PUBLIC_MEET # no meeting host here: the Meet button explains instead
        value: "off"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
